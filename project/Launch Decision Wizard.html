<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Launch Decision Wizard — Owner Manager Playbook</title>

<!-- Owner Design System tokens, fonts, defaults -->
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="variations/wizard.css" />

<style>
  html, body { margin: 0; height: 100%; background: var(--warm-cream); overflow: hidden; }
  #root { width: 100%; height: 100%; }
  /* Smooth out scroll regions */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>

<!-- React + Babel (pinned, with integrity) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<!-- shared content (vanilla, sets window.FRAMEWORK + window.deriveOutcome) -->
<script src="shared-content.js"></script>

<!-- The dev server serves .svg with image/png MIME, which the browser
     rejects for <img> tags. Pre-fetch the brand SVGs as blob URLs with
     the correct type, expose them on window.OWNER_LOGOS, then mount. -->
<script>
(async function () {
  const sources = {
    lockupBlack: "assets/owner-lockup-black.svg",
    lockupWhite: "assets/owner-lockup-white.svg",
    markBlack: "assets/owner-logomark-black.svg",
    markWhite: "assets/owner-logomark-white.svg",
  };
  const out = {};
  await Promise.all(Object.entries(sources).map(async ([k, url]) => {
    try {
      const t = await fetch(url).then(r => r.text());
      out[k] = URL.createObjectURL(new Blob([t], { type: "image/svg+xml" }));
    } catch (e) { out[k] = url; }
  }));
  window.OWNER_LOGOS = out;
  window.dispatchEvent(new Event("owner-logos-ready"));
})();
</script>

<!-- Tweaks panel host (must come before any component using window.useTweaks) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- The wizard component -->
<script type="text/babel" src="variations/wizard.jsx"></script>

<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useEffect, useState } = React;

function App() {
  const [logosReady, setLogosReady] = useState(!!window.OWNER_LOGOS);
  useEffect(() => {
    if (window.OWNER_LOGOS) { setLogosReady(true); return; }
    const h = () => setLogosReady(true);
    window.addEventListener("owner-logos-ready", h);
    return () => window.removeEventListener("owner-logos-ready", h);
  }, []);
  if (!logosReady) return null;
  return <window.DecisionWizard />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body>
</html>
